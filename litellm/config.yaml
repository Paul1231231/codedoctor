model_list:

  - model_name: codedoctor-qwen

    litellm_params:
      model: openai/qwen3.7-plus
      api_base: os.environ/MODEL_API_URL
      api_key: os.environ/MODEL_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retires: 2
  timeout: 30
  